[project]
name = "iace-chimera"
version = "0.1.0"
description = "Computational Hyperbolic Input–output MIMO Equation Routines & Algebra"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2.1",
    "scipy>=1.15.1",
    "sympy>=1.13.3",
]

[dependency-groups]
dev = [
    "iace-chimera",
    "pytest",
    "pytest-cov",
    "ruff>=0.14.9",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
    module-name = "chimera"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s -o log_cli=True"
testpaths = [
    "tests",
]
